[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppt-agent-cli"
version = "0.2.4b1"
description = "WPS-first, agent-native PPTX command line adapter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11,<13",
  "pydantic>=2.11,<3",
  "python-pptx==1.0.2",
  "pywin32>=310,<312; platform_system == 'Windows'",
  "typer>=0.16,<1",
]

[project.scripts]
ppt-agent = "ppt_agent.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.20,<5",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ppt_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ppt_agent"]
